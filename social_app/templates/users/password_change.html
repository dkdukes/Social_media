{% extends "base.html" %}

{% block title %}
Change Password
{% endblock %}

{% block content %}

<div class="max-w-lg mx-auto mt-10 bg-white shadow-lg rounded-xl p-8">

    <h1 class="text-2xl font-bold mb-6">
        Change Password
    </h1>

    <form method="POST" class="space-y-5">

        {% csrf_token %}

        {{ form.as_p }}

        <button
            type="submit"
            class="w-full bg-blue-600 text-white py-2 rounded-lg hover:bg-blue-700"
        >
            Change Password
        </button>

    </form>

</div>

{% endblock %}
