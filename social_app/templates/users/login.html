{% extends 'base.html' %}

{% block content %}
<div class="max-w-md mx-auto mt-10 bg-white shadow-lg rounded-lg p-8">
    <h2 class="text-2xl font-bold text-center mb-6">
        Login
    </h2>

    <form method="POST" class="space-y-4">
        {% csrf_token %}

        {{ form.as_p }}

        <button
            type="submit"
            class="w-full bg-blue-600 text-white py-2 rounded-lg hover:bg-blue-700 transition mb-4"
        >
            Login
        </button>
    </form>
    <p>Don't have an account? <a href="{% url 'create-user'%}" class="text-blue-300 hover:text-blue-400 text-lg cursor-pointer">Create account</a></p>
</div>
{% endblock %}
