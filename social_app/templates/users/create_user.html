{% extends 'base.html' %}

{% block content %}
<div class="max-w-xl mx-auto mt-10 bg-white shadow-lg rounded-lg p-6">

    <h2 class="text-2xl font-bold mb-6 text-center">
        Create Account
    </h2>

    <form method="POST" enctype="multipart/form-data" class="space-y-2">
        {% csrf_token %}

        {{ form.as_p }}

        <button
            type="submit"
            class="px-6 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700 transition w-full mb-4"
        >
            Submit
        </button>
    </form>
    <p>Already have an account? <a href="{% url 'login-user'%}" class="text-blue-300 hover:text-blue-400 text-lg cursor-pointer">Login</a></p>
</div>
{% endblock %}
