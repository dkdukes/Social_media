{% extends "base.html" %}

{% block content %}

<div class="max-w-lg mx-auto mt-10 bg-white shadow rounded-lg p-6">

    <h2 class="text-2xl font-bold text-red-600">
        Delete Post
    </h2>

    <p class="my-4">
        Are you sure you want to delete this post?
    </p>

    <img src="{{ post.image.url }}" class="rounded mb-4">

    <form method="POST">
        {% csrf_token %}

        <button
            type="submit"
            class="bg-red-600 text-white px-4 py-2 rounded">
            Yes, Delete
        </button>

        <a href="{% url 'my-posts' %}"
           class="ml-3 bg-gray-500 text-white px-4 py-2 rounded">
            Cancel
        </a>

    </form>

</div>

{% endblock %}
