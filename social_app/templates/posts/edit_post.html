{% extends "base.html" %}

{% block content %}

<div class="max-w-xl mx-auto mt-8 bg-white shadow rounded-lg p-6">

    <h2 class="text-2xl font-bold mb-4">Edit Post</h2>

    <form method="POST" enctype="multipart/form-data">
        {% csrf_token %}
        {{ form.as_p }}

        <button
            type="submit"
            class="bg-blue-600 text-white px-4 py-2 rounded">
            Save Changes
        </button>
    </form>

</div>

{% endblock %}
