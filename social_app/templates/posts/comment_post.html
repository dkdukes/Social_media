{% extends "base.html" %}

{% block content %}

<div class="max-w-xl mx-auto mt-8">

    <h2 class="text-xl font-bold mb-4">
        Comment on {{ post.caption }}
    </h2>

    <form method="POST">
        {% csrf_token %}

        <textarea
            name="content"
            rows="4"
            placeholder="Write a comment..."
            class="w-full border rounded-lg p-3"
            required
        ></textarea>

        <button
            type="submit"
            class="mt-3 bg-blue-500 text-white px-5 py-2 rounded-lg"
        >
            Post Comment
        </button>
    </form>

</div>

{% endblock %}
