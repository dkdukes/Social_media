<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{% block title %}Social Media APP{% endblock %}</title>

    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>

<body class="bg-gray-100">

    <!-- Navbar -->
    <nav class="bg-gray-900 text-white px-6 py-4">
        <div class="max-w-6xl mx-auto flex justify-between items-center">

            <h1 class="text-xl font-bold">
                Social Media APP
            </h1>

            {% if user.is_authenticated %}

            <div class="relative">

                <!-- User menu button -->
                <button
                    onclick="toggleMenu()"
                    class="flex items-center gap-2 hover:text-gray-300"
                >

                    {% if user.image %}
                        <img
                            src="{{ user.image.url }}"
                            alt="{{ user.username }}"
                            class="w-10 h-10 rounded-full object-cover"
                        >
                    {% endif %}

                    <span>
                        {{ user.username }}
                    </span>

                    <span>▼</span>

                </button>


                <!-- Dropdown -->
                <div
                    id="userMenu"
                    class="hidden absolute right-0 mt-2 w-48 bg-white text-gray-800 rounded-lg shadow-lg overflow-hidden"
                >

                    <a
                        href="{% url 'settings' %}"
                        class="block px-4 py-3 hover:bg-gray-100"
                    >
                        ⚙️ Settings
                    </a>

                    <a
                        href="{% url 'my-posts' %}"
                        class="block px-4 py-3 hover:bg-gray-100"
                    >
                        📝 My Posts
                    </a>

                    <a
                        href="{% url 'followers' %}"
                        class="block px-4 py-3 hover:bg-gray-100"
                    >
                        👥 Followers
                    </a>

                    <a
                        href="{% url 'following' %}"
                        class="block px-4 py-3 hover:bg-gray-100"
                    >
                        👤 Following
                    </a>

                    <div class="border-t"></div>

                    <form method="POST" action="{% url 'logout-user' %}">
                        {% csrf_token %}

                        <button
                            type="submit"
                            class="w-full text-left px-4 py-3 hover:bg-gray-100 text-red-600"
                        >
                            🚪 Logout
                        </button>
                    </form>

                </div>

            </div>

            {% endif %}

        </div>
    </nav>


    <!-- Page Content -->
    <main class="max-w-6xl mx-auto py-6 px-4">

        {% block content %}

        {% endblock %}

    </main>
    <script>
    function toggleMenu() {
        const menu = document.getElementById("userMenu");

        menu.classList.toggle("hidden");
    }
    </script>
</body>
</html>
